name = "basalt-sync"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Cron Trigger — runs every 10 minutes
[triggers]
crons = ["*/10 * * * *"]

# D1 database binding — shared with the Pages app
[[d1_databases]]
binding = "DB"
database_name = "basalt"
database_id = "c4180715-68e4-4d01-8cf7-a3e0ce5bb960"
migrations_dir = "../migrations"

# Secrets (set via `wrangler secret put`):
#   NOTION_API_KEY
#   NOTION_ARTICLES_DATABASE_ID
#   NOTION_PHOTOS_DATABASE_ID
#   TELEGRAM_CHANNEL_USERNAME
#   RSSHUB_INSTANCE (optional)
#   DOUBAN_USER_RSS (optional)
